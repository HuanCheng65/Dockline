<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; }
    a { color: oklch(0.62 0.14 258); } a:hover { color: oklch(0.52 0.14 258); }
    .desk { position: relative; overflow: hidden; border-radius: 14px; }
    .desk::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10); border-radius: 14px; pointer-events: none; }
    .glass-dark {
      background: linear-gradient(180deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.07) 100%);
      backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 16px 44px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.45), inset 0 0 0 0.5px rgba(255,255,255,0.22);
    }
    .glass-light {
      background: linear-gradient(180deg, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.38) 100%);
      backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 16px 40px rgba(0,0,0,0.14), inset 0 1px 0 rgba(255,255,255,0.85), inset 0 0 0 0.5px rgba(255,255,255,0.55);
    }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 5px 5px; border-radius: 15px; }
    .cell-live { background: rgba(255,255,255,0.14); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.34); }
    .cell-live-l { background: rgba(255,255,255,0.70); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.9); }
    .lbl { font-size: 10.5px; letter-spacing: 0.1px; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 4px; height: 4px; border-radius: 2px; }
  </style>
</helmet>

<div style="width: 1040px; background: oklch(0.16 0.012 258); padding: 26px 26px 30px; box-sizing: border-box; color: oklch(0.94 0.006 258);">

  <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px;">
    <div style="font-size: 19px; font-weight: 600; letter-spacing: -0.2px;">方向 A · 一体玻璃条</div>
    <div style="font-size: 13px; line-height: 1.55; color: oklch(0.70 0.010 258); max-width: 760px;">整条 bar 是一整块玻璃，轮廓最接近原生 Dock，认知成本最低。同 App 窗口靠间距收紧表达聚拢；出现歧义时，该组格子下方长出标签，bar 随之变高——密度随歧义自动调节。<br><span style="color: oklch(0.62 0.010 258);">代价：与系统 Dock 形似，分组信号偏弱；一旦任一组有歧义，整条 bar 都变高。</span></div>
  </div>

  <!-- 深色桌面 -->
  <div class="desk" style="height: 232px; background: linear-gradient(155deg, oklch(0.34 0.09 268) 0%, oklch(0.22 0.07 292) 46%, oklch(0.15 0.04 250) 100%);">
    <div style="position: absolute; left: 92px; top: 26px; width: 420px; height: 150px; border-radius: 11px; background: linear-gradient(180deg, oklch(0.30 0.02 258), oklch(0.24 0.015 258)); box-shadow: 0 20px 50px rgba(0,0,0,0.42);"></div>
    <div style="position: absolute; right: 74px; top: 52px; width: 300px; height: 132px; border-radius: 11px; background: linear-gradient(180deg, oklch(0.86 0.03 88), oklch(0.72 0.05 62)); box-shadow: 0 20px 50px rgba(0,0,0,0.36);"></div>

    <div class="glass-dark" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px; border-radius: 23px; padding: 7px 9px;">
      <div style="display: flex; align-items: flex-end; gap: 11px;">

        <!-- 单窗口 App：纯图标 -->
        <div style="display: flex; gap: 11px; align-items: flex-end;">
          <div class="cell cell-live">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.60 0.17 268)"/><path d="M11 27c0-8 4-14 9-14s9 6 9 14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
            <div class="dot" style="background: oklch(0.86 0.02 258);"></div>
          </div>
          <div class="cell">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.66 0.15 152)"/><path d="M12 16h16v11a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2z" fill="#fff" opacity="0.92"/><circle cx="17" cy="22" r="1.6" fill="oklch(0.55 0.14 152)"/><circle cx="23" cy="22" r="1.6" fill="oklch(0.55 0.14 152)"/></svg>
            <div class="dot" style="background: transparent;"></div>
          </div>
          <!-- 最小化：原地变灰，绝不挪位 -->
          <div class="cell" style="opacity: 0.42;">
            <svg width="40" height="40" viewBox="0 0 40 40" style="filter: grayscale(1);"><rect width="40" height="40" rx="10" fill="oklch(0.62 0.15 232)"/><rect x="11" y="12" width="18" height="16" rx="3" fill="#fff" opacity="0.9"/><path d="M11 19h18" stroke="oklch(0.55 0.14 232)" stroke-width="2"/></svg>
            <div class="dot" style="background: transparent;"></div>
          </div>
        </div>

        <div style="width: 1px; height: 40px; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.16), transparent); margin: 0 1px 14px;"></div>

        <!-- 同 App 多窗口：格子相邻 + 区分性短标签 -->
        <div style="display: flex; gap: 2px; align-items: flex-end;">
          <div class="cell">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.30 0.02 258)"/><path d="M14 17l4 3.5-4 3.5M21 25h6" stroke="oklch(0.82 0.14 152)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="lbl" style="color: oklch(0.80 0.008 258);">QQBot</div>
          </div>
          <div class="cell cell-live">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.30 0.02 258)"/><path d="M14 17l4 3.5-4 3.5M21 25h6" stroke="oklch(0.82 0.14 152)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="lbl" style="color: oklch(0.94 0.006 258);">bench</div>
          </div>
          <div class="cell">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.30 0.02 258)"/><path d="M14 17l4 3.5-4 3.5M21 25h6" stroke="oklch(0.82 0.14 152)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="lbl" style="color: oklch(0.80 0.008 258);">moor</div>
          </div>
        </div>

        <div style="width: 1px; height: 40px; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.16), transparent); margin: 0 1px 14px;"></div>

        <div style="display: flex; gap: 2px; align-items: flex-end;">
          <div class="cell">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.62 0.16 258)"/><path d="M17 15l-5 5 5 5M23 15l5 5-5 5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="lbl" style="color: oklch(0.80 0.008 258);">plan.md</div>
          </div>
          <div class="cell">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.62 0.16 258)"/><path d="M17 15l-5 5 5 5M23 15l5 5-5 5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="lbl" style="color: oklch(0.80 0.008 258);">BarModel</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 浅色桌面 -->
  <div class="desk" style="height: 178px; margin-top: 14px; background: linear-gradient(155deg, oklch(0.88 0.05 232) 0%, oklch(0.82 0.07 258) 52%, oklch(0.90 0.04 92) 100%);">
    <div style="position: absolute; left: 120px; top: 20px; width: 380px; height: 104px; border-radius: 11px; background: rgba(255,255,255,0.72); box-shadow: 0 16px 40px rgba(0,0,0,0.16);"></div>
    <div class="glass-light" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px; border-radius: 23px; padding: 7px 9px;">
      <div style="display: flex; align-items: flex-end; gap: 11px;">
        <div style="display: flex; gap: 11px; align-items: flex-end;">
          <div class="cell cell-live-l">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.60 0.17 268)"/><path d="M11 27c0-8 4-14 9-14s9 6 9 14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
            <div class="dot" style="background: oklch(0.35 0.02 258);"></div>
          </div>
          <div class="cell">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.66 0.15 152)"/><path d="M12 16h16v11a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2z" fill="#fff" opacity="0.92"/><circle cx="17" cy="22" r="1.6" fill="oklch(0.55 0.14 152)"/><circle cx="23" cy="22" r="1.6" fill="oklch(0.55 0.14 152)"/></svg>
            <div class="dot" style="background: transparent;"></div>
          </div>
          <div class="cell" style="opacity: 0.40;">
            <svg width="40" height="40" viewBox="0 0 40 40" style="filter: grayscale(1);"><rect width="40" height="40" rx="10" fill="oklch(0.62 0.15 232)"/><rect x="11" y="12" width="18" height="16" rx="3" fill="#fff" opacity="0.9"/><path d="M11 19h18" stroke="oklch(0.55 0.14 232)" stroke-width="2"/></svg>
            <div class="dot" style="background: transparent;"></div>
          </div>
        </div>
        <div style="width: 1px; height: 40px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.10), transparent); margin: 0 1px 14px;"></div>
        <div style="display: flex; gap: 2px; align-items: flex-end;">
          <div class="cell">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.30 0.02 258)"/><path d="M14 17l4 3.5-4 3.5M21 25h6" stroke="oklch(0.82 0.14 152)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="lbl" style="color: oklch(0.40 0.010 258);">QQBot</div>
          </div>
          <div class="cell cell-live-l">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.30 0.02 258)"/><path d="M14 17l4 3.5-4 3.5M21 25h6" stroke="oklch(0.82 0.14 152)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="lbl" style="color: oklch(0.24 0.012 258); font-weight: 500;">bench</div>
          </div>
          <div class="cell">
            <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="oklch(0.30 0.02 258)"/><path d="M14 17l4 3.5-4 3.5M21 25h6" stroke="oklch(0.82 0.14 152)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="lbl" style="color: oklch(0.40 0.010 258);">moor</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态图例 -->
  <div style="display: flex; gap: 26px; margin-top: 20px; font-size: 11.5px; color: oklch(0.66 0.010 258); flex-wrap: wrap;">
    <div style="display: flex; align-items: center; gap: 7px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: oklch(0.86 0.02 258);"></span>当前前台窗口（底部圆点 + 格子微亮）</div>
    <div style="display: flex; align-items: center; gap: 7px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: oklch(0.50 0 0);"></span>已最小化（去饱和 + 降透明，原地不挪位）</div>
    <div style="display: flex; align-items: center; gap: 7px;"><span style="width: 14px; height: 2px; background: oklch(0.55 0.010 258);"></span>同 App 相邻，组间留白</div>
    <div style="display: flex; align-items: center; gap: 7px;">标签仅在同 App 多窗口时出现，上限 84pt</div>
  </div>

</div>
</x-dc>

</html>
